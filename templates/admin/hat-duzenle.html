{% extends 'admin/base_admin.html' %} {% block title %}Hat Düzenle{% endblock %} {% block page_title %}Hat Düzenle{% endblock %} {% block content %}
<div class="form-card">
    <h1>Hat Düzenle</h1>

    <form method="POST">
        <div class="form-group">
            <label>Hat Kodu</label>
            <input type="text" name="hat_kodu" value="{{ hat.hat_kodu }}" required>
        </div>

        <div class="form-group">
            <label>Hat Adı</label>
            <input type="text" name="hat_adi" value="{{ hat.hat_adi }}" required>
        </div>

        <div class="form-group">
            <label>Durum</label>
            <select name="aktif" required>
                <option value="true" {% if hat.aktif %}selected{% endif %}>Aktif</option>
                <option value="false" {% if not hat.aktif %}selected{% endif %}>Pasif</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Güncelle</button>
    </form>
</div>
{% endblock %}
