{% extends 'admin/base_admin.html' %} {% block title %}Araç Düzenle{% endblock %} {% block page_title %}Araç Düzenle{% endblock %} {% block content %}

<div class="page-card">
    <h2>Araç Düzenle</h2>
    <p>Seçili aracın bilgilerini güncelleyebilirsin.</p>

    <form action="{{ url_for('admin_arac_duzenle', otobus_id=arac.otobus_id) }}" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="plaka">Plaka</label>
                <input type="text" id="plaka" name="plaka" class="form-input" value="{{ arac.plaka }}" required>
            </div>

            <div class="form-group">
                <label for="marka">Marka</label>
                <input type="text" id="marka" name="marka" class="form-input" value="{{ arac.marka }}" required>
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <input type="text" id="model" name="model" class="form-input" value="{{ arac.model }}" required>
            </div>

            <div class="form-group">
                <label for="kapasite">Kapasite</label>
                <input type="number" id="kapasite" name="kapasite" class="form-input" value="{{ arac.kapasite }}" required>
            </div>

            <div class="form-group">
                <label for="kilometre">Kilometre</label>
                <input type="number" id="kilometre" name="kilometre" class="form-input" value="{{ arac.kilometre }}" required>
            </div>

            <div class="form-group">
                <label for="durum">Durum</label>
                <select id="durum" name="durum" class="select-input" required>
                    <option value="Garajda" {% if arac.durum == 'Garajda' %}selected{% endif %}>Garajda</option>
                    <option value="Seferde" {% if arac.durum == 'Seferde' %}selected{% endif %}>Seferde</option>
                    <option value="Bakımda" {% if arac.durum == 'Bakımda' %}selected{% endif %}>Bakımda</option>
                    <option value="Pasif" {% if arac.durum == 'Pasif' %}selected{% endif %}>Pasif</option>
                </select>
            </div>

            <div class="form-group">
                <label for="yogunluk">Yoğunluk</label>
                <select id="yogunluk" name="yogunluk" class="select-input" required>
                    <option value="Düşük" {% if arac.yogunluk == 'Düşük' %}selected{% endif %}>Düşük</option>
                    <option value="Orta" {% if arac.yogunluk == 'Orta' %}selected{% endif %}>Orta</option>
                    <option value="Yüksek" {% if arac.yogunluk == 'Yüksek' %}selected{% endif %}>Yüksek</option>
                </select>
            </div>

            <div class="form-group full">
                <label for="kamera_yolu">Görsel / Kamera Yolu</label>
                <input type="text" id="kamera_yolu" name="kamera_yolu" class="form-input" value="{{ arac.kamera_yolu }}">
            </div>
        </div>

        <div class="toolbar" style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Güncelle</button>
            <a href="{{ url_for('admin_araclar') }}" class="btn btn-light">Listeye Dön</a>
        </div>
    </form>
</div>

{% endblock %}
