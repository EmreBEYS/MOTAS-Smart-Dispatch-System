{% extends 'admin/base_admin.html' %} {% block title %}Durak Düzenle{% endblock %} {% block page_title %}Durak Düzenle{% endblock %} {% block content %}

<div class="page-card">
    <h2>Durak Düzenle</h2>
    <p>Seçili durağın bilgilerini güncelleyebilirsin.</p>

    <form action="{{ url_for('admin_durak_duzenle', durak_id=durak.durak_id) }}" method="POST">
        <div class="form-grid">
            <div class="form-group full">
                <label for="durak_adi">Durak Adı</label>
                <input type="text" id="durak_adi" name="durak_adi" class="form-input" value="{{ durak.durak_adi }}" required>
            </div>

            <div class="form-group">
                <label for="latitude">Enlem (Latitude)</label>
                <input type="text" id="latitude" name="latitude" class="form-input" value="{{ durak.latitude }}" required>
            </div>

            <div class="form-group">
                <label for="longitude">Boylam (Longitude)</label>
                <input type="text" id="longitude" name="longitude" class="form-input" value="{{ durak.longitude }}" required>
            </div>
        </div>

        <div class="toolbar" style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Güncelle</button>
            <a href="{{ url_for('admin_duraklar') }}" class="btn btn-light">Listeye Dön</a>
        </div>
    </form>
</div>

{% endblock %}
