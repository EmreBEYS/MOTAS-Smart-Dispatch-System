{% extends 'base.html' %} {% block title %}Giriş Yap{% endblock %} {% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-logo-area">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="MOTAŞ Logo" class="auth-logo">
            <h1>Malatya Ulaşım AŞ</h1>
            <p>Hesabınıza giriş yaparak online işlemlere erişin.</p>
        </div>

        <form class="auth-form" method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email adresinizi girin" required>
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" placeholder="Şifrenizi girin" required>
            </div>

            <button type="submit" class="btn auth-btn">Giriş Yap</button>

            <div class="auth-links">
                <a href="{{ url_for('register') }}">Hesabın yok mu? Kayıt ol</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
